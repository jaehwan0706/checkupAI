# Render(백엔드) + Supabase(DB) 배포용 프로필 — AWS(EC2)의 prod 프로필과 이름이 겹치지 않게 render로 분리
# 활성화: Render 환경변수에 SPRING_PROFILES_ACTIVE=render 설정
# 아래 값은 전부 플레이스홀더 — 실제 값은 Render 대시보드의 환경변수로만 주입한다 (git에 커밋 금지)

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}

gemini.api.key=${GEMINI_API_KEY}

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI}

toss.client-key=${TOSS_CLIENT_KEY}
toss.secret-key=${TOSS_SECRET_KEY}

frontend.url=${FRONTEND_URL}
