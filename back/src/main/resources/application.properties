spring.application.name=checkupai-backend
# Render 등 배포 플랫폼은 PORT 환경변수로 리스닝 포트를 지정한다 (로컬은 8081 유지)
server.port=${PORT:8081}

# 기본 실행 프로필 = local (application-local.properties 값으로 덮어씀)
# EC2 배포 시에는 실행 옵션에 -Dspring.profiles.active=prod 등을 지정해 이 값을 덮어쓸 것
spring.profiles.active=local

# ===== 데이터베이스 =====
spring.datasource.url=jdbc:mysql://localhost:3306/checkupai?useSSL=false&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=checkupai
spring.datasource.password=checkupai1234!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.datasource.hikari.initialization-fail-timeout=0

# ===== 인코딩 =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.output.ansi.enabled=always

# ===== JWT =====
jwt.secret=checkupai-super-secret-key-for-jwt-authentication-256bits
jwt.expiration=86400000

# ===== 파일 업로드 (PDF) =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Jackson =====
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Gemini API =====
# 실제 키는 application-local.properties(git 미포함)에서 덮어씁니다.
gemini.api.key=
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.model=gemini-2.5-flash

# ===== 카카오 OAuth2 =====
spring.security.oauth2.client.registration.kakao.client-id=d1ccc3c94dfec3af30e2289f9c722c5c
